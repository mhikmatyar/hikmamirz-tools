<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PixVerse Showcase</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 360px; height: 640px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
// Motion graphic showcase "Agent + PixVerse plugin" (9:16, 1080x1920).
// Semua teks ada di CONFIG. Ubah agar sesuai prompt dan langkah asli.
// Slot A (hasil) dan slot B (rekaman layar) diisi video asli oleh
// buat-video.mjs; tanpa video, slot diisi gambar contoh (pratinjau).
// =====================================================================
const CONFIG = {
  handle: '@hikmamirz',
  hook: ['ONE PROMPT.', 'ONE AGENT.', 'A FULL ANIME', 'FOOTBALL FILM.'],
  resultTag: 'MADE WITH AGENT + PIXVERSE PLUGIN',
  resultTitle: 'THE LAST MINUTE',
  steps: [
    {
      title: 'Brief the agent',
      sub: 'One detailed prompt into Claude Code',
      log: [
        ['user', '› Make a 10s anime football short:'],
        ['user', '  underdog striker, 90+ min, heavy rain,'],
        ['user', '  stadium lights, cinematic slow-mo.'],
      ],
    },
    {
      title: 'Agent plans the shots',
      sub: 'Reference image first, then 3 shot prompts',
      log: [
        ['agent', '● Agent: splitting story into 3 shots'],
        ['dim', '  1  Rainy stadium, wide establishing'],
        ['dim', '  2  Close-up: striker\'s eyes, last chance'],
        ['dim', '  3  Bicycle kick, ball hits the net'],
      ],
    },
    {
      title: 'PixVerse plugin renders',
      sub: 'All 3 shots generated in parallel',
      log: [
        ['agent', '● Calling PixVerse plugin'],
        ['bar', 'shot 1'],
        ['bar', 'shot 2'],
        ['bar', 'shot 3'],
      ],
    },
    {
      title: 'Check & retake',
      sub: 'It checks every frame, redoes bad takes',
      log: [
        ['agent', '● Agent: joining shots, export 9:16'],
        ['ok', '✓ the_last_minute.mp4 ready'],
      ],
    },
  ],
  tools: [
    ['AI', 'Claude Code', 'the agent: plans & writes prompts'],
    ['PV', 'PixVerse plugin', 'generates every shot'],
    ['ED', 'Quick edit', 'music + captions'],
  ],
  ctaTop: 'TRY THE',
  ctaMain: ['PIXVERSE', 'PLUGIN'],
  url: 'app.pixverse.ai/cli/marketing',
  tag: '#PixVersePlugin',
};

// Waktu adegan (detik). buat-video.mjs membaca nilai ini lewat window.TIMELINE.
const TL = {
  duration: 49,
  hook: [0, 3],
  result: [3, 18],
  how: [18, 20],
  work: [20, 38],
  tools: [38, 42.5],
  cta: [42.5, 49],
};
// Slot video (piksel). Slot A layar penuh, slot B isi jendela terminal.
const SLOT_A = { x: 0, y: 0, w: 1080, h: 1920 };
const SLOT_B = { x: 70, y: 616, w: 940, h: 640 };
window.TIMELINE = { TL, SLOT_A, SLOT_B };

const W = 1080, H = 1920;
const C = {
  bg: '#06080E', bg2: '#0D1220', ink: '#F4F6FB', mute: '#8A93A8',
  lime: '#D4FF3A', cyan: '#3BE3FF', pink: '#FF3D8B', panel: '#0B0F1A',
};
const DISPLAY = '"Inter Display", Inter, sans-serif';
const MONO = '"DejaVu Sans Mono", "Liberation Mono", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- util ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function font(w, size, fam = DISPLAY) { ctx.font = `${w} ${size}px ${fam}`; }
function fitFont(text, w, size, maxW, fam = DISPLAY) {
  font(w, size, fam);
  while (ctx.measureText(text).width > maxW && size > 10) { size -= 2; font(w, size, fam); }
  return size;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Teks yang muncul dari balik masker (naik dari bawah).
function revealText(text, x, y, size, color, p, { weight = 900, align = 'left', spacing = 0, maxW = 960 } = {}) {
  if (p <= 0) return;
  const s = fitFont(text, weight, size, maxW);
  ctx.save();
  ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(text);
  const left = align === 'center' ? x - m.width / 2 : align === 'right' ? x - m.width : x;
  ctx.beginPath(); ctx.rect(left - 20, y - s * 1.0, m.width + 40, s * 1.25); ctx.clip();
  ctx.fillStyle = color;
  ctx.fillText(text, x, y + (1 - eOut(p)) * s * 1.1);
  ctx.restore();
}
function pill(text, cx, y, { bg = C.lime, fg = '#000', size = 30, p = 1, padX = 28 } = {}) {
  if (p <= 0) return;
  ctx.save();
  font(800, size); ctx.letterSpacing = '2px';
  const w = ctx.measureText(text).width + padX * 2, h = size * 1.9;
  ctx.globalAlpha = eOut(p);
  ctx.translate(cx, y + (1 - eOut(p)) * 30);
  rrect(-w / 2, 0, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, h / 2 + 2);
  ctx.restore();
}

// ---------- latar ----------
const grainRand = rng(7);
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = grainRand() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 18; }
  g.putImageData(d, 0, 0); }

function background(t, hue = C.cyan) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // cahaya bergerak
  const gx = 540 + Math.sin(t * 0.6) * 300, gy = 700 + Math.cos(t * 0.4) * 400;
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 1100);
  g.addColorStop(0, hue + '33'); g.addColorStop(1, '#00000000');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // grid perspektif
  ctx.save(); ctx.strokeStyle = '#ffffff0d'; ctx.lineWidth = 2;
  const off = (t * 60) % 120;
  for (let x = -off; x < W + 120; x += 120) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -off; y < H + 120; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function finish(t) {
  ctx.save();
  const ox = Math.floor((t * 97) % 256), oy = Math.floor((t * 61) % 256);
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(grain, 'repeat');
  ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  v.addColorStop(0, '#00000000'); v.addColorStop(1, '#000000aa');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function watermark(a = 1) {
  ctx.save(); ctx.globalAlpha = 0.75 * a; font(700, 30); ctx.fillStyle = C.ink;
  ctx.textAlign = 'center'; ctx.fillText(CONFIG.handle, 540, H - 70); ctx.restore();
}

// ---------- slot (lubang untuk video asli / gambar contoh) ----------
let MODE = 'preview'; // 'preview' = slot diisi contoh, 'layer' = slot transparan
function slot(pathFn, placeholderFn) {
  ctx.save();
  if (MODE === 'layer') {
    ctx.globalCompositeOperation = 'destination-out';
    pathFn(); ctx.fillStyle = '#000'; ctx.fill();
  } else {
    pathFn(); ctx.clip(); placeholderFn();
  }
  ctx.restore();
}

// Contoh hasil: stadion malam, hujan, sorot lampu (diganti klip PixVerse asli).
const rainR = rng(42);
const drops = Array.from({ length: 260 }, () => [rainR() * W, rainR() * H, 30 + rainR() * 60, 0.4 + rainR() * 0.6]);
function placeholderResult(t) {
  const lt = t - TL.result[0];
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a1430'); sky.addColorStop(0.55, '#1b2a55'); sky.addColorStop(0.56, '#0f3d22'); sky.addColorStop(1, '#06210f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // tribun
  ctx.fillStyle = '#05081a'; ctx.fillRect(0, 760, W, 300);
  const cr = rng(3);
  for (let i = 0; i < 500; i++) { const x = cr() * W, y = 780 + cr() * 260; const fl = Math.sin(lt * 8 + i) > 0.85;
    ctx.fillStyle = fl ? '#ffffffcc' : '#ffffff1f'; ctx.fillRect(x, y, 4, 4); }
  // sorot lampu
  for (const [lx, dir] of [[120, 1], [960, -1]]) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const b = ctx.createLinearGradient(lx, 200, lx + dir * 500, 1400);
    b.addColorStop(0, '#fff7d0aa'); b.addColorStop(1, '#fff7d000');
    ctx.fillStyle = b; ctx.beginPath(); ctx.moveTo(lx - 20, 200); ctx.lineTo(lx + 20, 200);
    ctx.lineTo(lx + dir * 700, 1500); ctx.lineTo(lx + dir * 200, 1500); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(lx, 200, 26, 0, 7); ctx.fill(); ctx.restore();
  }
  // garis lapangan
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(540, 1450, 380, 110, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 1450); ctx.lineTo(W, 1450); ctx.stroke();
  // siluet pemain + bola
  const jump = Math.sin(clamp(lt / 6) * Math.PI) * 220;
  ctx.save(); ctx.translate(540, 1380 - jump); ctx.rotate(-clamp(lt / 6) * Math.PI * 1.2);
  ctx.fillStyle = '#020309';
  ctx.beginPath(); ctx.arc(0, -150, 42, 0, 7); ctx.fill();
  ctx.fillRect(-40, -110, 80, 150);
  ctx.save(); ctx.rotate(0.9); ctx.fillRect(-18, 20, 36, 170); ctx.restore();
  ctx.save(); ctx.rotate(-0.5); ctx.fillRect(-18, 20, 36, 160); ctx.restore();
  ctx.restore();
  const bx = 540 + clamp((lt - 4) / 2) * 420, by = 1150 - jump * 0.6 - clamp((lt - 4) / 2) * 200;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 22, 0, 7); ctx.fill();
  // hujan
  ctx.strokeStyle = '#cfe3ff55'; ctx.lineWidth = 2;
  for (const [x, y, l, s] of drops) { const yy = (y + lt * 1800 * s) % H, xx = x - (lt * 300 * s) % W;
    ctx.beginPath(); ctx.moveTo((xx + W) % W, yy); ctx.lineTo((xx + W) % W - l * 0.25, yy + l); ctx.stroke(); }
  // label contoh
  ctx.save(); ctx.globalAlpha = 0.9; font(700, 30); ctx.fillStyle = '#ffffffaa'; ctx.textAlign = 'center';
  ctx.fillText('[ PREVIEW — your PixVerse clip goes here ]', 540, 1700); ctx.restore();
}

// Contoh rekaman layar: log agent yang diketik (diganti rekaman layar asli).
function placeholderTerminal(t) {
  const { x, y, w, h } = SLOT_B;
  ctx.fillStyle = C.panel; ctx.fillRect(x, y, w, h);
  font(400, 26, MONO); ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.letterSpacing = '0px';
  const stepDur = (TL.work[1] - TL.work[0]) / CONFIG.steps.length;
  let line = 0;
  const lh = 36, px = x + 32, py0 = y + 28;
  CONFIG.steps.forEach((st, si) => {
    const s0 = TL.work[0] + si * stepDur + 0.35;
    st.log.forEach((ln, li) => {
      const lt0 = s0 + li * 0.55;
      if (t < lt0) { line++; return; }
      const [kind, text] = ln;
      const py = py0 + line * lh;
      if (kind === 'bar') {
        const p = eInOut(prog(t, lt0, lt0 + 1.6));
        ctx.fillStyle = C.mute; ctx.fillText('  ' + text, px, py);
        const bx = px + 190, bw = 460;
        ctx.fillStyle = '#ffffff14'; ctx.fillRect(bx, py + 5, bw, 20);
        ctx.fillStyle = C.lime; ctx.fillRect(bx, py + 5, bw * p, 20);
        ctx.fillStyle = p >= 1 ? C.lime : C.mute;
        ctx.fillText(p >= 1 ? '✓ done' : Math.round(p * 100) + '%', bx + bw + 20, py);
      } else {
        const chars = kind === 'user' ? Math.floor((t - lt0) * 55) : text.length;
        ctx.fillStyle = { user: C.ink, agent: C.cyan, dim: C.mute, ok: C.lime }[kind];
        ctx.fillText(text.slice(0, chars), px, py);
      }
      line++;
    });
    line++;
  });
  // kursor berkedip
  if (Math.floor(t * 2.5) % 2 === 0) { ctx.fillStyle = C.lime; ctx.fillRect(px, py0 + line * lh - 2, 16, 32); }
}

// ---------- adegan ----------
function sceneHook(t) {
  background(t, C.lime);
  pill('AGENT + PIXVERSE PLUGIN', 540, 520, { p: prog(t, 0.0, 0.4), size: 30 });
  const lines = CONFIG.hook, ys = [820, 960, 1100, 1240], at = [0.15, 0.55, 1.0, 1.25];
  lines.forEach((s, i) => revealText(s, 540, ys[i], 128, i >= 2 ? C.lime : C.ink, prog(t, at[i], at[i] + 0.45), { align: 'center', spacing: -2 }));
  // zoom pukulan kecil
  const a = prog(t, 2.0, 2.6);
  ctx.save(); ctx.globalAlpha = a; font(700, 34); ctx.fillStyle = C.mute; ctx.textAlign = 'center';
  ctx.fillText('watch the result ↓', 540, 1450 + Math.sin(t * 6) * 8); ctx.restore();
}

function sceneResult(t) {
  const lt = t - TL.result[0];
  const r = lerp(0, 1110, eInOut(prog(lt, 0, 0.6)));
  if (r < 1110) sceneHook(t);
  slot(() => { ctx.beginPath(); if (r >= 1110) ctx.rect(0, 0, W, H); else ctx.arc(540, 960, r, 0, 7); },
       () => placeholderResult(t));
  // garis tepi lingkaran saat membuka
  if (r < 1110) { ctx.save(); ctx.strokeStyle = C.lime; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(540, 960, r, 0, 7); ctx.stroke(); ctx.restore(); }
  // UI di atas video
  const ui = prog(lt, 0.7, 1.1);
  pill(CONFIG.resultTag, 540, 140, { p: ui, size: 28 });
  if (ui > 0) {
    ctx.save(); ctx.globalAlpha = eOut(ui);
    ctx.fillStyle = '#00000088'; rrect(60, 1690, 960, 130, 26); ctx.fill();
    font(900, 46); ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.letterSpacing = '1px';
    ctx.fillText(CONFIG.resultTitle, 100, 1752);
    font(600, 28); ctx.fillStyle = C.lime; ctx.fillText('Agent + PixVerse plugin · ' + CONFIG.handle, 100, 1796);
    // bar progres
    ctx.fillStyle = '#ffffff33'; ctx.fillRect(0, H - 12, W, 12);
    ctx.fillStyle = C.lime; ctx.fillRect(0, H - 12, W * prog(t, TL.result[0], TL.result[1]), 12);
    ctx.restore();
  }
}

function sceneHow(t) {
  background(t, C.pink);
  const lt = t - TL.how[0];
  const s = 1 + 0.08 * (1 - eOut(prog(lt, 0, 0.5)));
  ctx.save(); ctx.translate(540, 960); ctx.scale(s, s); ctx.translate(-540, -960);
  revealText('HOW', 540, 860, 230, C.ink, prog(lt, 0.0, 0.35), { align: 'center', spacing: -6 });
  revealText('I MADE IT', 540, 1080, 190, C.lime, prog(lt, 0.15, 0.5), { align: 'center', spacing: -6 });
  ctx.restore();
  pill(CONFIG.steps.length + ' STEPS · ONE PROMPT', 540, 1210, { p: prog(lt, 0.5, 0.9), bg: '#ffffff18', fg: C.ink, size: 28 });
}

function sceneWork(t) {
  background(t, C.cyan);
  const lt = t - TL.work[0];
  const n = CONFIG.steps.length, stepDur = (TL.work[1] - TL.work[0]) / n;
  const si = Math.min(n - 1, Math.floor(lt / stepDur)), st = lt - si * stepDur;
  // header
  font(800, 30); ctx.letterSpacing = '6px'; ctx.fillStyle = C.mute; ctx.textAlign = 'center';
  ctx.fillText('HOW I MADE IT', 540, 230); ctx.letterSpacing = '0px';
  // titik langkah
  for (let i = 0; i < n; i++) {
    const cx = 540 + (i - (n - 1) / 2) * 150, act = i <= si;
    ctx.fillStyle = act ? C.lime : '#ffffff22'; rrect(cx - 60, 280, 120, 10, 5); ctx.fill();
  }
  // jendela
  const wp = eOut(prog(lt, 0, 0.5));
  const { x, y, w, h } = SLOT_B;
  ctx.save(); ctx.globalAlpha = wp;
  ctx.shadowColor = C.cyan + '55'; ctx.shadowBlur = 60;
  rrect(x, y - 64, w, h + 64, 28); ctx.fillStyle = '#151b2c'; ctx.fill();
  ctx.shadowBlur = 0;
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 40 + i * 36, y - 32, 11, 0, 7); ctx.fill(); });
  font(600, 24); ctx.fillStyle = C.mute; ctx.textAlign = 'center';
  ctx.fillText('agent  ·  pixverse plugin', 540, y - 24);
  ctx.restore();
  slot(() => { ctx.beginPath(); ctx.rect(x, y, w, h); }, () => placeholderTerminal(t));
  // kartu langkah
  const cp = prog(st, 0, 0.45);
  const stp = CONFIG.steps[si];
  ctx.save();
  font(900, 150); ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.globalAlpha = eOut(cp);
  ctx.fillText(String(si + 1).padStart(2, '0'), 70 - (1 - eOut(cp)) * 60, 1470);
  ctx.restore();
  revealText(stp.title, 70, 1580, 78, C.ink, cp, { spacing: -1, maxW: 940 });
  ctx.save(); ctx.globalAlpha = eOut(prog(st, 0.25, 0.7)); font(500, 38); ctx.fillStyle = C.mute;
  ctx.textAlign = 'left'; ctx.fillText(stp.sub, 72, 1650); ctx.restore();
  // sebutan plugin di langkah 3
  if (si === 2) pill('PIXVERSE PLUGIN', 860, 1395, { p: prog(st, 0.4, 0.8), bg: C.pink, fg: '#fff', size: 26 });
  watermark();
}

function sceneTools(t) {
  background(t, C.lime);
  const lt = t - TL.tools[0];
  revealText('TOOLS I USED', 540, 520, 110, C.ink, prog(lt, 0, 0.4), { align: 'center', spacing: -3 });
  CONFIG.tools.forEach(([ic, name, desc], i) => {
    const p = eBack(prog(lt, 0.35 + i * 0.25, 0.85 + i * 0.25));
    if (p <= 0) return;
    const y = 680 + i * 240;
    ctx.save(); ctx.translate((1 - p) * 700, 0); ctx.globalAlpha = clamp(p);
    rrect(70, y, 940, 200, 32); ctx.fillStyle = i === 1 ? C.lime : '#ffffff10'; ctx.fill();
    rrect(110, y + 40, 120, 120, 26); ctx.fillStyle = i === 1 ? '#000' : C.lime; ctx.fill();
    font(900, 48); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = i === 1 ? C.lime : '#000';
    ctx.fillText(ic, 170, y + 102);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    font(900, 56); ctx.fillStyle = i === 1 ? '#000' : C.ink; ctx.fillText(name, 270, y + 95);
    font(500, 32); ctx.fillStyle = i === 1 ? '#000000aa' : C.mute; ctx.fillText(desc, 272, y + 145);
    ctx.restore();
  });
  ctx.save(); ctx.globalAlpha = eOut(prog(lt, 1.6, 2.1)); font(700, 36); ctx.fillStyle = C.ink; ctx.textAlign = 'center';
  ctx.fillText('Idea → agent → PixVerse plugin → video', 540, 1480); ctx.restore();
  watermark();
}

function sceneCta(t) {
  background(t, C.pink);
  const lt = t - TL.cta[0];
  revealText(CONFIG.ctaTop, 540, 600, 90, C.mute, prog(lt, 0, 0.35), { align: 'center', spacing: 4, weight: 800 });
  revealText(CONFIG.ctaMain[0], 540, 780, 190, C.ink, prog(lt, 0.15, 0.55), { align: 'center', spacing: -6 });
  revealText(CONFIG.ctaMain[1], 540, 960, 190, C.lime, prog(lt, 0.3, 0.7), { align: 'center', spacing: -6 });
  // kotak URL
  const up = eBack(prog(lt, 0.8, 1.3));
  if (up > 0) {
    ctx.save(); ctx.translate(540, 1140); ctx.scale(up, up);
    const sz = fitFont(CONFIG.url, 700, 50, 860, MONO);
    const tw = ctx.measureText(CONFIG.url).width;
    rrect(-tw / 2 - 40, -60, tw + 80, 120, 24); ctx.fillStyle = '#ffffff12'; ctx.fill();
    ctx.strokeStyle = C.lime; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(CONFIG.url, 0, 4);
    ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = eOut(prog(lt, 1.4, 1.8)); font(700, 40); ctx.fillStyle = C.ink; ctx.textAlign = 'center';
  ctx.fillText('Link in caption ↓', 540, 1290 + Math.sin(t * 5) * 8); ctx.restore();
  pill(CONFIG.tag, 540, 1400, { p: prog(lt, 1.8, 2.2), bg: C.pink, fg: '#fff', size: 40 });
  ctx.save(); ctx.globalAlpha = eOut(prog(lt, 2.2, 2.6)); font(800, 44); ctx.fillStyle = C.lime; ctx.textAlign = 'center';
  ctx.fillText('Follow ' + CONFIG.handle + ' for more AI films', 540, 1640); ctx.restore();
}

// Sapuan transisi diagonal di setiap pergantian adegan.
function wipe(t, t0, color) {
  const p = prog(t, t0 - 0.3, t0 + 0.3);
  if (p <= 0 || p >= 1) return;
  const x = lerp(-1600, 1600, eInOut(p));
  ctx.save(); ctx.translate(540 + x, 960); ctx.rotate(-0.35);
  ctx.fillStyle = color; ctx.fillRect(-700, -1600, 1400, 3200);
  ctx.fillStyle = '#000'; ctx.fillRect(-760, -1600, 60, 3200);
  ctx.restore();
}

function render(t, mode = 'preview') {
  MODE = mode;
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  const inSlotScene = t >= TL.result[0] && t < TL.result[1];
  if (t < TL.result[0]) sceneHook(t);
  else if (t < TL.result[1]) sceneResult(t);
  else if (t < TL.how[1]) sceneHow(t);
  else if (t < TL.work[1]) sceneWork(t);
  else if (t < TL.tools[1]) sceneTools(t);
  else sceneCta(t);
  // grain/vignette jangan menutupi klip asli di mode layer
  if (!(mode === 'layer' && inSlotScene)) { if (!(mode === 'layer' && t >= TL.work[0] && t < TL.work[1])) finish(t); }
  wipe(t, TL.result[1], C.lime);
  wipe(t, TL.work[0], C.cyan);
  wipe(t, TL.tools[0], C.pink);
  wipe(t, TL.cta[0], C.lime);
  ctx.restore();
}

window.renderFrame = (t, mode, type = 'image/png', q) => { render(t, mode); return cv.toDataURL(type, q); };
window.ready = document.fonts.load('900 100px "Inter Display"')
  .then(() => Promise.all([document.fonts.load('500 40px "Inter Display"'), document.fonts.load('700 40px "DejaVu Sans Mono"')]))
  .then(() => true);

// Pratinjau langsung di browser: buka file ini, video berjalan berulang.
if (!navigator.webdriver) {
  const start = performance.now();
  const loop = () => { render(((performance.now() - start) / 1000) % TL.duration); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
